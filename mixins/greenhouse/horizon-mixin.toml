[mod]
id = "greenhouse"
version = "0.1.0"
priority = 100

[compatibility]
# The tagged Nightly this bundle is pinned to (nightly-source/2026-10-30-ba6344a).
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

# The support module: compiled inside Horizon, and the same file is the
# standalone testable crate (see Cargo.toml).
[[module]]
id = "greenhouse"
file = "crates/horizon-client-render/src/gfx/translucency.rs"
name = "greenhouse"
source = "runtime.rs"

# The draw-path scaffold: factors the band arithmetic out of `push`, behaviour
# identical, and counts the pushes so the per-frame draw volume is observable.
# `push`'s body has no closures, which is what OVERWRITE requires.
[[injection]]
id = "push-band"
kind = "OVERWRITE"
target = "horizon_client_render::gfx::page_runs::PageRuns::push"
helper = "push.rs"
bindings = [
  { name = "runs", ty = "&mut PageRuns", value = "&mut *self" },
  { name = "distance", ty = "u64", value = "distance" },
  { name = "page", ty = "u32", value = "page" },
  { name = "start", ty = "usize", value = "start" },
  { name = "len", ty = "usize", value = "len" },
  { name = "tag", ty = "[u32; 3]", value = "tag" },
]
